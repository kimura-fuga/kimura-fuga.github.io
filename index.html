<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            width: 600px; /* 幅を広くする */
            height: 200px; /* 高さを追加 */
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace; /* コードブロックのようにする */
            white-space: pre-wrap; /* 改行を保持し、折り返す */
            overflow-wrap: break-word; /* 長い単語を折り返す */
            top: 10px;
            right: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
    <script type="module" src="./pkg/hnyfuck.js"></script>
    <script type="module">
        import init, { hny_run } from "./pkg/hnyfuck.js";

        function run() {
            init().then(() => {
                const output = hny_run();
                console.log(output);
                document.getElementById("output").textContent = output;
            });
        }

        window.run = run;
    </script>
</head>
<body>
    <input type="text" id="code">
    <button onclick="run()">Run</button>

    <p id="output"></p>
</body>
</html>
